<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addition Adventure</title>
  <style>
    :root {
      --card: #ffffff;
      --primary: #ff6b6b;
      --green: #2fb344;
      --red: #e03131;
      --ink: #243b53;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive, sans-serif;
      text-align: center;
      color: var(--ink);
      background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 55%, #fef6d8 100%);
      overflow-x: hidden;
    }

    main {
      width: min(960px, 96vw);
      margin: 0 auto;
      padding: 22px 10px 38px;
    }

    h1 {
      margin: 8px 0 12px;
      color: var(--primary);
      font-size: clamp(2rem, 7vw, 4rem);
      text-shadow: 2px 3px 0 #fff;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: clamp(1.05rem, 4vw, 1.35rem);
      font-weight: 700;
    }

    .badge {
      min-width: 140px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .question-card {
      padding: 18px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 10px 24px rgba(36, 59, 83, 0.18);
    }

    #q {
      margin: 0 0 16px;
      font-size: clamp(1.6rem, 6vw, 3rem);
      color: #6741d9;
    }

    .grid {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 148px;
      margin: 14px auto 8px;
    }

    .group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      min-width: 112px;
      min-height: 112px;
      padding: 12px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.18);
      animation: pop 0.3s ease;
    }

    .plus {
      font-size: clamp(2.2rem, 8vw, 4rem);
      font-weight: 900;
      color: #ff922b;
      text-shadow: 1px 2px 0 #fff;
    }

    .item {
      font-size: clamp(1.45rem, 6vw, 2.3rem);
      line-height: 1;
    }

    .answer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    label {
      font-size: 1.25rem;
      font-weight: 700;
    }

    input {
      width: min(190px, 70vw);
      padding: 13px 15px;
      border: 4px solid #74c0fc;
      border-radius: 16px;
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: #ff922b;
      box-shadow: 0 0 0 5px rgba(255, 146, 43, 0.2);
    }

    #msg {
      min-height: 42px;
      margin-top: 16px;
      font-size: clamp(1.35rem, 5vw, 2rem);
      font-weight: 900;
      transition: all 0.25s;
    }

    .right { color: var(--green); }
    .wrong { color: var(--red); }

    .confetti {
      position: fixed;
      top: -12px;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      animation: fall 2s linear forwards;
      pointer-events: none;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      85% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <main>
    <h1>➕ Addition Adventure</h1>

    <div class="top" aria-label="Score board">
      <div class="badge">⭐ Right <span id="rightCount">0</span></div>
      <div class="badge">💪 Wrong <span id="wrongCount">0</span></div>
      <div class="badge">🎯 Level <span id="level">1</span></div>
    </div>

    <section class="question-card" aria-live="polite">
      <h2 id="q"></h2>
      <div id="grid" class="grid"></div>
      <div class="answer-row">
        <label for="answer">Type your answer:</label>
        <input id="answer" name="answer" type="number" inputmode="numeric" pattern="[0-9]*" min="0" autocomplete="off" aria-describedby="msg">
      </div>
      <div id="msg"></div>
    </section>
  </main>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>

  <script>
    let right = 0;
    let wrong = 0;
    let level = 1;
    let firstNumber = 4;
    let secondNumber = 4;
    let answer = 8;
    let isAdvancing = false;

    const icons = ["🍎", "⭐", "🐥", "🧸", "🚗", "🍓", "🌈", "⚽"];

    function randomNumber() {
      return Math.floor(Math.random() * 6) + 4;
    }

    function play(id) {
      const sound = document.getElementById(id);
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function confetti() {
      for (let i = 0; i < 28; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = `hsl(${Math.random() * 360}, 100%, 55%)`;
        piece.style.animationDelay = Math.random() * 0.25 + "s";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2300);
      }
    }

    function makeGroup(count, icon) {
      const group = document.createElement("div");
      group.className = "group";
      group.setAttribute("aria-label", `${count} items`);

      for (let i = 0; i < count; i++) {
        const item = document.createElement("span");
        item.className = "item";
        item.textContent = icon;
        group.appendChild(item);
      }

      return group;
    }

    function nextQuestion() {
      firstNumber = randomNumber();
      secondNumber = randomNumber();
      answer = firstNumber + secondNumber;

      document.getElementById("q").textContent = `${firstNumber} + ${secondNumber} = ?`;

      const icon = icons[Math.floor(Math.random() * icons.length)];
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      grid.appendChild(makeGroup(firstNumber, icon));

      const plus = document.createElement("div");
      plus.className = "plus";
      plus.textContent = "+";
      grid.appendChild(plus);

      grid.appendChild(makeGroup(secondNumber, icon));

      const input = document.getElementById("answer");
      input.value = "";
      isAdvancing = false;
      input.focus();
    }

    function updateScore() {
      document.getElementById("rightCount").textContent = right;
      document.getElementById("wrongCount").textContent = wrong;
      document.getElementById("level").textContent = level;
    }

    function showMessage(text, className) {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = className;
    }

    function checkAnswer() {
      if (isAdvancing) {
        return;
      }

      const input = document.getElementById("answer");
      const typed = input.value.trim();

      if (typed === "") {
        showMessage("", "");
        return;
      }

      const value = Number(typed);

      if (!Number.isInteger(value)) {
        showMessage("⌨️ Please type a whole number.", "wrong");
        input.focus();
        return;
      }

      if (value === answer) {
        isAdvancing = true;
        right++;
        level = Math.floor(right / 5) + 1;
        updateScore();
        showMessage("🎉 Great job!", "right");
        play("correctSound");
        confetti();
        setTimeout(() => {
          showMessage("", "");
          nextQuestion();
        }, 900);
        return;
      }

      const answerDigits = String(answer).length;
      const hasTypedEnoughDigits = typed.length >= answerDigits;

      if (hasTypedEnoughDigits) {
        wrong++;
        updateScore();
        showMessage("❌ Try again! Count the pictures.", "wrong");
        play("wrongSound");
        input.select();
      }
    }

    document.getElementById("answer").addEventListener("input", checkAnswer);
    updateScore();
    nextQuestion();
  </script>
</body>
</html>
